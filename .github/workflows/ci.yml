name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "renovate.json"
  pull_request:
    paths-ignore:
      - "README.md"
      - "renovate.json"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: Tech-S1/ci-templates/.github/workflows/go-ci.yml@1855d5a3ad7ac87cb4b683aed176c50c691beaf6 # v0.2.4
    with:
      build-packages: .
