name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: Tech-S1/ci-templates/.github/workflows/go-release.yml@59d1ba4531f379719fb8f5c4e14fb8f097ece7bb # v0.2.1
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      binary-package: .
      binary-name: openbao-plugin-secrets-garage
      ldflags-package: github.com/ZachTech-HomeLab/vault-plugin-secrets-garage/internal/buildinfo
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    secrets: inherit
